name: Build PC Monitor Server

on:
  push:
    branches: ["**"]
    paths:
      - "pc_monitor/**"
      - ".github/workflows/build-pc-monitor.yml"
  pull_request:
    paths:
      - "pc_monitor/**"
      - ".github/workflows/build-pc-monitor.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PCMonitorServer-windows-x86_64
            bin: PCMonitorServer.exe
          - os: macos-latest
            artifact: PCMonitorServer-macos-universal
            bin: PCMonitorServer
          - os: ubuntu-latest
            artifact: PCMonitorServer-linux-x86_64
            bin: PCMonitorServer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        working-directory: pc_monitor
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build executable
        shell: bash
        working-directory: pc_monitor
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) SEP=';' ;;
            *)                    SEP=':' ;;
          esac

          python -m PyInstaller \
            --noconfirm --clean --onefile \
            --name PCMonitorServer \
            --console \
            --add-data "templates${SEP}templates" \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.loops.asyncio \
            app_entry.py

      - name: Smoke test (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: pc_monitor
        run: |
          ls -lh dist/
          file "dist/${{ matrix.bin }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pc_monitor/dist/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 14
