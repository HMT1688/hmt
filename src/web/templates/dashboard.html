
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 발비닐 레벨 발굴 시스템</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; }
        .header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 2rem; text-align: center;
        }
        .header h1 { margin: 0; font-size: 2rem; }
        .header p { margin: 0.5rem 0 0 0; opacity: 0.9; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { 
            background: white; padding: 2rem; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;
        }
        .stat-value { font-size: 2.5rem; font-weight: bold; margin-bottom: 0.5rem; }
        .stat-label { color: #666; font-size: 0.9rem; }
        .controls { 
            background: white; padding: 2rem; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem;
        }
        .btn { 
            background: #667eea; color: white; border: none;
            padding: 1rem 2rem; border-radius: 8px; cursor: pointer;
            margin-right: 1rem; margin-bottom: 1rem; font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover { background: #5a67d8; }
        .btn-success { background: #48bb78; }
        .btn-success:hover { background: #38a169; }
        .btn-warning { background: #ed8936; }
        .btn-warning:hover { background: #dd6b20; }
        .keywords { 
            background: white; padding: 2rem; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .keyword-item { 
            padding: 1.5rem; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .keyword-text { font-weight: 600; font-size: 1.1rem; }
        .keyword-meta { font-size: 0.9rem; color: #666; margin-top: 0.25rem; }
        .keyword-stats { display: flex; gap: 1rem; align-items: center; }
        .growth-positive { color: #48bb78; font-weight: bold; }
        .growth-negative { color: #f56565; font-weight: bold; }
        .opportunity-high { background: #ffd700; color: #744210; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .opportunity-medium { background: #bee3f8; color: #2b6cb0; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .stage-explosive { background: #fed7d7; color: #c53030; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .stage-growth { background: #c6f6d5; color: #22543d; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .loading { text-align: center; padding: 3rem; color: #666; }
        .api-status { 
            position: fixed; top: 1rem; right: 1rem;
            background: white; padding: 1rem; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-size: 0.9rem;
        }
        .status-dot { 
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 0.5rem;
        }
        .status-ok { background: #48bb78; }
        .status-error { background: #f56565; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 발비닐 레벨 발굴 시스템</h1>
        <p>3년 트렌드 분석으로 숨겨진 기회를 조기 발굴합니다</p>
    </div>

    <div class="api-status">
        <span class="status-dot status-ok"></span>
        API 연결됨 • 실시간 분석
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" style="color: #667eea;" id="total-keywords">0</div>
                <div class="stat-label">분석된 키워드</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #48bb78;" id="opportunity-keywords">0</div>
                <div class="stat-label">고기회 키워드</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #ed8936;" id="explosive-keywords">0</div>
                <div class="stat-label">폭발적 성장</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #9f7aea;" id="new-keywords">0</div>
                <div class="stat-label">오늘 새 발견</div>
            </div>
        </div>

        <div class="controls">
            <h3 style="margin-top: 0;">⚡ 시스템 제어</h3>
            <button class="btn" onclick="runAnalysis()">🔄 수동 분석 실행</button>
            <button class="btn btn-success" onclick="generateKeywords()">🌱 키워드 생성</button>
            <button class="btn btn-warning" onclick="loadKeywords()">📊 데이터 새로고침</button>
            <button class="btn" onclick="exportData()">💾 데이터 내보내기</button>
            <button class="btn" onclick="logout()" style="background: #f56565;">🚪 로그아웃</button>
        </div>

        <div class="keywords">
            <h3 style="margin-top: 0;">🌟 발견된 키워드 (기회점수 순)</h3>
            <div id="keyword-list" class="loading">
                키워드를 불러오는 중...
            </div>
        </div>
    </div>

    <script>
        // 키워드 목록 로드
        async function loadKeywords() {
            try {
                const response = await fetch('/api/keywords');
                const data = await response.json();
                
                const container = document.getElementById('keyword-list');
                
                if (data.keywords && data.keywords.length > 0) {
                    container.innerHTML = data.keywords.map(keyword => {
                        const growthClass = keyword.growth_rate >= 0 ? 'growth-positive' : 'growth-negative';
                        const growthSign = keyword.growth_rate >= 0 ? '+' : '';
                        const opportunityClass = keyword.opportunity_score >= 70 ? 'opportunity-high' : 'opportunity-medium';
                        const stageClass = keyword.stage === 'explosive' ? 'stage-explosive' : 'stage-growth';
                        
                        return `
                            <div class="keyword-item">
                                <div>
                                    <div class="keyword-text">${keyword.text}</div>
                                    <div class="keyword-meta">
                                        ${keyword.category} • 분석: ${new Date(keyword.created_at).toLocaleDateString()}
                                        ${keyword.base_keyword ? ' • 파생: ' + keyword.base_keyword : ''}
                                    </div>
                                </div>
                                <div class="keyword-stats">
                                    <span class="${opportunityClass}">기회 ${keyword.opportunity_score}</span>
                                    <span class="${stageClass}">${keyword.stage}</span>
                                    <span class="${growthClass}">
                                        ${growthSign}${keyword.growth_rate}%
                                    </span>
                                    ${keyword.acceleration ? `<span style="color: #666; font-size: 0.8rem;">가속 ${keyword.acceleration}%</span>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="loading">아직 분석된 키워드가 없습니다. "수동 분석 실행" 버튼을 눌러보세요.</div>';
                }
            } catch (error) {
                console.error('키워드 로드 오류:', error);
                document.getElementById('keyword-list').innerHTML = '<div class="loading">키워드를 불러오는 중 오류가 발생했습니다.</div>';
            }
        }

        // 통계 업데이트
        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('total-keywords').textContent = data.total_keywords || 0;
                document.getElementById('opportunity-keywords').textContent = data.opportunity_keywords || 0;
                document.getElementById('explosive-keywords').textContent = data.explosive_keywords || 0;
                document.getElementById('new-keywords').textContent = data.new_keywords || 0;
            } catch (error) {
                console.error('통계 업데이트 오류:', error);
            }
        }

        // 수동 분석 실행
        async function runAnalysis() {
            try {
                const response = await fetch('/api/analyze', { method: 'POST' });
                const data = await response.json();
                
                alert('실제 트렌드 분석이 시작되었습니다! 잠시 후 새로고침해주세요.');
                
                setTimeout(() => {
                    loadKeywords();
                    updateStats();
                }, 5000);
            } catch (error) {
                console.error('분석 실행 오류:', error);
                alert('분석 실행 중 오류가 발생했습니다.');
            }
        }

        // 키워드 생성
        async function generateKeywords() {
            try {
                const response = await fetch('/api/generate', { method: 'POST' });
                const data = await response.json();
                
                alert(`스마트 키워드 ${data.count}개가 생성되었습니다!`);
                loadKeywords();
                updateStats();
            } catch (error) {
                console.error('키워드 생성 오류:', error);
                alert('키워드 생성 중 오류가 발생했습니다.');
            }
        }

        // 데이터 내보내기
        async function exportData() {
            try {
                window.open('/api/export', '_blank');
            } catch (error) {
                console.error('데이터 내보내기 오류:', error);
                alert('데이터 내보내기 중 오류가 발생했습니다.');
            }
        }

        // 로그아웃
        function logout() {
            if (confirm('로그아웃하시겠습니까?')) {
                window.location.href = '/logout';
            }
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadKeywords();
            updateStats();
            
            // 30초마다 자동 새로고침
            setInterval(() => {
                updateStats();
            }, 30000);
        });
    </script>
</body>
</html>
