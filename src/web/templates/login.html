
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 트렌드 키워드 발굴 시스템 - API 로그인</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: white; padding: 3rem; border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px; width: 90%;
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { color: #333; margin: 0; font-size: 2rem; }
        .logo p { color: #666; margin: 0.5rem 0 0 0; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        .form-input { 
            width: 100%; padding: 1rem; border: 2px solid #e1e5e9;
            border-radius: 8px; font-size: 1rem; box-sizing: border-box;
        }
        .form-input:focus { border-color: #667eea; outline: none; }
        .btn { 
            width: 100%; padding: 1rem; background: #667eea; color: white;
            border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #5a67d8; }
        .help-text { 
            background: #f8f9fa; padding: 1rem; border-radius: 8px;
            margin-top: 1.5rem; font-size: 0.9rem; color: #666;
        }
        .help-text a { color: #667eea; text-decoration: none; }
        .help-text a:hover { text-decoration: underline; }
        .features {
            margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e1e5e9;
        }
        .feature-item {
            display: flex; align-items: center; margin-bottom: 1rem;
            color: #666; font-size: 0.9rem;
        }
        .feature-icon { margin-right: 0.5rem; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎯 키워드 발굴 시스템</h1>
            <p>"발비닐" 레벨 조기 발굴 시스템</p>
        </div>
        
        <form method="post" action="/login">
            <div class="form-group">
                <label class="form-label">네이버 Client ID</label>
                <input type="text" name="client_id" class="form-input" 
                       placeholder="네이버 개발자센터에서 발급받은 Client ID" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">네이버 Client Secret</label>
                <input type="password" name="client_secret" class="form-input" 
                       placeholder="네이버 개발자센터에서 발급받은 Client Secret" required>
            </div>
            
            <button type="submit" class="btn">🚀 시스템 시작하기</button>
        </form>
        
        <div class="help-text">
            <strong>📋 API 키 발급 방법:</strong><br>
            1. <a href="https://developers.naver.com/main/" target="_blank">네이버 개발자센터</a> 접속<br>
            2. 애플리케이션 등록 → 데이터랩 API 선택<br>
            3. Client ID와 Client Secret 복사
        </div>
        
        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">📊</span>
                3년 트렌드 분석으로 계절성 구분
            </div>
            <div class="feature-item">
                <span class="feature-icon">🌱</span>
                파생 키워드 연쇄 분석
            </div>
            <div class="feature-item">
                <span class="feature-icon">⚡</span>
                "발비닐" 레벨 기회 자동 발굴
            </div>
            <div class="feature-item">
                <span class="feature-icon">🤖</span>
                아이템스카우트 수동작업 자동화
            </div>
        </div>
    </div>
</body>
</html>
